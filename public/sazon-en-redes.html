.scene{position:relative;height:520px;isolation:isolate;container-type:inline-size;display:block}


.scene .phone{position:absolute;top:3%;left:50%;transform:translateX(-50%) rotate(-6deg);scale:none;width:min(202px, 57%);height:auto;aspect-ratio:9/19.5}
.scene .screen{display:block;background:#fff9ec}
.profile{position:relative;height:100%;display:flex;flex-direction:column;padding-top:23px;color:#242820}
.profile[hidden]{display:none}
.profile-network{padding:8px 14px;font-size:15px;font-weight:750;color:var(--network,#244b39)}
.profile-cover{position:relative;height:36%;flex-shrink:0;background:var(--tacos) center/cover}
.profile-name{padding:12px 14px 0;font:22px/1.05 Georgia}
.profile-action{position:relative;margin:11px 14px}
.follow{width:100%;min-height:38px;border:0;border-radius:7px;background:var(--network,#244b39);color:white;font:700 14px system-ui;cursor:pointer}
.follow[aria-pressed=true]{color:#234b37;background:#dce9db}
.tap{position:absolute;pointer-events:none;left:67%;top:45%;width:36px;height:36px;border:3px solid #fff;border-radius:50%;background:#ffd489bb;box-shadow:0 0 0 2px #56351f,0 0 12px #ffd489;opacity:0}
.tap.demo{animation:follow-tap 1.8s ease-out both}
@keyframes follow-tap{0%,20%{opacity:0;transform:translate(27px,36px) scale(.8)}55%{opacity:1;transform:translate(0,0) scale(1)}75%{opacity:1;transform:scale(.72)}100%{opacity:0;transform:scale(1.65)}}
.profile[data-network=fb]{--network:#195dba}
.profile[data-network=tt]{--network:#bd3050}
.scene .motion{right:2%;bottom:0}
@media(min-width:711px) and (max-width:900px){.composition{padding-inline:25px;gap:20px;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.scene{height:425px}.scene .phone{width:min(172px,57%)}}
@media(max-width:710px){.scene{width:min(100%,460px);margin-inline:auto;height:425px}.scene .phone{width:min(172px,57%)}}

.actions button{position:relative}
.actions button.tapping{animation:button-press .7s ease both}
.actions button.tapping::after{content:"";position:absolute;left:70%;top:50%;width:32px;height:32px;border:3px solid #fff8df;border-radius:50%;background:#e8b96caa;box-shadow:0 0 0 2px #795426;pointer-events:none;animation:button-ripple .7s ease-out both}
@keyframes button-press{35%,55%{transform:scale(.975)}}
@keyframes button-ripple{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}40%{opacity:1;transform:translate(-50%,-50%) scale(.85)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

#order-view{background:#e8deca}
.chat-header{background:#125c49;color:#fff;padding:8px 10px;line-height:1.15}
.chat-header span,.chat-header strong{display:block}
.chat-header span{font-size:10px;margin-bottom:4px}
.chat-header strong{font-size:13px}
.chat-messages{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 6px;background:radial-gradient(#baad9a55 1px,transparent 1px) 0 0/12px 12px}
.chat-bubble{max-width:94%;margin:0;padding:6px 8px;color:#23382d;font-size:clamp(10px,3cqw,13px);line-height:1.3;border-radius:9px;box-shadow:0 1px 2px #221b1326}
.chat-out{align-self:flex-end;background:#d9f2cb;border-top-right-radius:2px}
.chat-in{align-self:flex-start;background:#fffdf4;border-top-left-radius:2px}
.chat-compose{display:flex;align-items:center;min-height:37px;gap:3px;margin:5px;padding:4px 5px;border-radius:14px;background:#fffdf4;font-size:10px}
.chat-draft{flex:1;min-width:0;white-space:nowrap;overflow:hidden;opacity:0}
.chat-send{text-decoration:none;border-radius:50%;background:#125c49;color:#fff;padding:4px 6px}
.chat-running .chat-draft{animation:chat-draft 1.1s steps(22,end) both}
.chat-running .chat-out{animation:chat-arrive .24s 1.08s both}
.chat-running .chat-in{animation:chat-arrive .24s 2.15s both}
@keyframes chat-draft{from{opacity:1;clip-path:inset(0 100% 0 0)}94%{opacity:1;clip-path:inset(0)}to{opacity:0;clip-path:inset(0)}}
@keyframes chat-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

.social-intro{position:absolute;inset:4% 0 9%;pointer-events:none}
.social-intro::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 46% 49% at 50% 47%,#fff9dd,#f4cc7ac9 34%,#8aab785f 63%,transparent 100%);opacity:0}
.social-intro.play::before{animation:social-flare 1.25s ease-out both}
.intro-icon{position:absolute;left:50%;top:48%;display:grid;place-items:center;width:49px;height:49px;border:1px solid #ffffffa0;border-radius:16px;color:#fff;box-shadow:0 8px 17px #38231d39;opacity:0}
.intro-wa{--x:clamp(-156px,-38cqw,-97px);--y:-87px;--tilt:-13deg;background:#16805b}
.intro-tt{--x:clamp(98px,36cqw,151px);--y:13px;--tilt:13deg;background:#241f29}
.intro-fb{--x:clamp(-151px,-37cqw,-96px);--y:91px;--tilt:-8deg;background:#215db9}
.social-intro.play .intro-icon{animation:social-fan 1.35s cubic-bezier(.2,.7,.25,1) both}
.social-intro.play .intro-tt{animation-delay:.12s}
.social-intro.play .intro-fb{animation-delay:.22s}
@keyframes social-flare{0%{opacity:0;transform:scale(.52)}38%{opacity:1}100%{opacity:.58;transform:scale(1)}}
@keyframes social-fan{0%,20%{opacity:0;transform:translate(-50%,-50%) scale(.3)}80%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--tilt)) scale(1.09)}100%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--tilt))}}

.intro-icon.intro-emoji{width:38px;height:38px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:var(--size);line-height:1;filter:drop-shadow(0 4px 4px #62412735)}
.social-intro.play .intro-emoji{animation-delay:var(--delay)}
#open-tiktok{float:right;color:inherit;text-decoration:none}
</style>

<script>
const channels=[...document.querySelectorAll('[data-channel]')];
const profile=document.querySelector('[data-network]');
const order=document.getElementById('order-view');
const network=document.getElementById('network-name');
const follow=document.querySelector('.follow');
const tap=document.querySelector('.tap');
const phone=document.querySelector('.phone');
const intro=document.querySelector('.social-intro');
const socialLinks={
  wa:'https://wa.me/50577765119',
  tt:'https://vm.tiktok.com/ZS9PGE6MwVYmE-kBDDf/'
};
function openSocial(channel){
  const url=socialLinks[channel];
  if(!url)return;
  if(channel==='tt')showcase.classList.add('tiktok-opened');
  window.open(url,'_blank','noopener,noreferrer');
}
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
document.querySelector('.motion')?.remove();
document.getElementById('social-title').innerHTML='Porque el buen <em>sazón se comparte.</em>';
const showcase=document.querySelector('.showcase');
document.getElementById('open-tiktok')?.addEventListener('click',event=>{
  event.preventDefault();
  openSocial('tt');
});
if(showcase && !reducedMotion.matches && 'IntersectionObserver' in window){
  const sectionEntry=new IntersectionObserver(([entry],observer)=>{
    if(!entry.isIntersecting)return;
    showcase.classList.add('section-entered');
    observer.disconnect();
  },{threshold:.12});
  sectionEntry.observe(showcase);
}
let inView=false;
let automatic=true;
let next=0;
let timer;
function setFollow(active){
  follow.setAttribute('aria-pressed',String(active));
  follow.textContent=active?'✓ Siguiendo':'Seguir';
}
function select(button){
  const selected=button.dataset.channel;
  for(const item of channels) item.setAttribute('aria-pressed',String(item===button));
  order.hidden=selected!=='wa';
  profile.hidden=!order.hidden;
  tap.classList.remove('demo');
  order.classList.remove('chat-running');
  if(profile.hidden){
    if(!reducedMotion.matches){
      void order.offsetWidth;
      order.classList.add('chat-running');
    }
    return;
  }
  profile.dataset.network=selected;
  network.textContent=selected==='fb'?'Facebook':'TikTok';
  document.getElementById('open-tiktok').hidden=selected!=='tt';
  setFollow(false);
  if(!reducedMotion.matches){
    void tap.offsetWidth;
    tap.classList.add('demo');
  }
}
function stop(){
  clearTimeout(timer);
  for(const button of channels) button.classList.remove('tapping');
  tap.classList.remove('demo');
}
function cycle(delay){
  stop();
  if(!automatic || !inView || document.hidden || reducedMotion.matches) return;
  timer=setTimeout(()=>{
    const button=channels[next];
    button.classList.add('tapping');
    timer=setTimeout(()=>{
      select(button);
      next=(next+1)%channels.length;
      timer=setTimeout(()=>cycle(0),3700);
    },280);
  },delay);
}
tap.addEventListener('animationend',()=>setFollow(true));
follow.addEventListener('click',()=>{
  const selected=channels.find(button=>button.getAttribute('aria-pressed')==='true');
  setFollow(follow.getAttribute('aria-pressed')!=='true');
  const url=selected && socialLinks[selected.dataset.channel];
  if(url) openSocial(selected.dataset.channel);
});
for(const button of channels) button.addEventListener('click',()=>{
  stop();
  select(button);
  next=(channels.indexOf(button)+1)%channels.length;
  cycle(3700);
  const url=socialLinks[button.dataset.channel];
  if(url) openSocial(button.dataset.channel);
});
new IntersectionObserver(([entry])=>{
  inView=entry.isIntersecting;
  intro.classList.toggle('play',inView);
  cycle(inView?1300:450);
},{threshold:.35}).observe(phone);
document.addEventListener('visibilitychange',()=>cycle(450));
reducedMotion.addEventListener('change',()=>cycle(450));
document.querySelector('.motion')?.addEventListener('click',()=>{
  const paused=motion.getAttribute('aria-pressed')!=='true';
  motion.setAttribute('aria-pressed',String(paused));
  document.querySelector('.showcase').classList.toggle('paused',paused);
  motion.textContent=paused?'Reanudar animación':'Pausar animación';
  if(!paused) automatic=true;
  cycle(450);
});
</script></html>
