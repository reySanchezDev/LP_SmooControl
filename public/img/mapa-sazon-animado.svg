<svg xmlns="http://www.w3.org/2000/svg" viewBox="600 182 865 319" role="img" aria-labelledby="map-title map-desc">
      <title id="map-title">La Sazón de Sheyla frente al Parque Central de Nindirí</title>
      <desc id="map-desc">Calles y cruces del centro de Nindirí, redibujados a partir de la captura de Google Maps. La animación entra por la Calle Central Este y baja por el costado oeste del Parque Central.</desc>
  <style>
    .route{stroke-dasharray:100;animation:draw-route 5s ease-in-out infinite}
    .destination{animation:show-stop 5s ease-in-out infinite}
    @keyframes draw-route{
      0%,18%{stroke-dashoffset:100}
      58%{stroke-dashoffset:0}
      100%{stroke-dashoffset:0}
    }
    @keyframes show-stop{
      0%,58%{opacity:0}
      68%,100%{opacity:1}
    }
    @media(prefers-reduced-motion:reduce){.route,.destination{animation:none}}
  </style>

